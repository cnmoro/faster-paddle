[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "faster-paddle"
version = "1.0.2"
description = "Fast CPU OCR — PaddleOCR PP-OCRv6 tiny/small/medium in Rust + ONNX Runtime, with hardware-aware scheduling and multi-image recognition."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "cnmoro", email = "cnmoro@gmail.com" }]
keywords = ["ocr", "paddleocr", "ppocr", "onnx", "onnxruntime", "rust", "cpu", "text-recognition"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/cnmoro/faster-paddle"
Repository = "https://github.com/cnmoro/faster-paddle"

[tool.maturin]
module-name = "faster_paddle"
features = ["pyo3/extension-module"]
strip = true
# Model bytes are embedded in the extension. Cargo.toml includes the source
# assets in sdists; duplicating them as wheel data would inflate downloads.
