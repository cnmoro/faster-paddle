name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Serialize runs that share a ref so a tag push can't spawn two runs that race
# each other's PyPI upload (that race produced a spurious "Publish to PyPI"
# failure on v1.0.0). cancel-in-progress:false lets an in-flight publish finish;
# a queued duplicate then re-runs and cleanly --skip-existing's the same files.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked
      - run: python -m pip install maturin pytest pillow
      - run: maturin build --release --locked --out dist-test
      - run: python -m pip install dist-test/*.whl
      - run: python -m pytest tests -q

  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 honestly needs glibc 2.34 (ONNX Runtime's pthread@GLIBC_2.34).
        # aarch64 builds NATIVELY on an arm64 runner (cross-compilation silently
        # failed to static-link libstdc++); its ONNX Runtime tops out at glibc
        # 2.28, so it's tagged manylinux_2_28.
        include:
          - target: x86_64
            runner: ubuntu-latest
            manylinux: "2_34"
          - target: aarch64
            runner: ubuntu-24.04-arm
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
          manylinux: ${{ matrix.manylinux }}
          # Tell ort-sys to skip its dynamic libstdc++ link; build.rs links the
          # C++ runtime statically instead, so the wheel doesn't depend on the
          # host's libstdc++.so.6 version (manylinux GCC 11 references
          # GLIBCXX_3.4.29 symbols missing on older systems).
          before-script-linux: export ORT_CXX_STDLIB=
      - name: Test installed wheel and linked runtime
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pip install pytest pillow dist/*.whl
          python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
      - name: Test installed wheel and linked runtime
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pip install pytest pillow dist/*.whl
          python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-14      # apple silicon
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
      - name: Test installed wheel and linked runtime
        shell: bash
        env:
          OCR_THREADS: "2"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pip install pytest pillow dist/*.whl
          python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # The medium models are too large for PyPI, so they ship as GitHub Release
  # assets and the library downloads them on demand (see fetch_cached in lib.rs).
  medium-models:
    name: Upload medium models to release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stage assets (names must match the runtime download URL)
        run: |
          cp models/medium/det.onnx ppocrv6_medium_det.onnx
          cp models/medium/rec.onnx ppocrv6_medium_rec.onnx
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ppocrv6_medium_det.onnx
            ppocrv6_medium_rec.onnx

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, linux, windows, macos, sdist]
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          # Configure this secret in repo settings → Secrets → Actions.
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
